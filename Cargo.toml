[package]
name = "zymosis"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "zym"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
